name: Auto Deploy to Hostinger DMS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Packages
        run: npm install --legacy-peer-deps

      - name: 4. Build Production App
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://vgwfimosnvhcipapxyjx.supabase.co

      - name: 5. Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./domains/primelinkenterprises.com/public_html/dms/
          dangerous-clean-slate: false
